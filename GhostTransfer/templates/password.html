<!DOCTYPE html>
<html>
  <head>
    <title>Password Required</title>
  </head>
  <body>
    <h2>Password Required</h2>
    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %}
    <form method="get">
      <input
        type="password"
        name="password"
        placeholder="Enter password"
        required
      />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
