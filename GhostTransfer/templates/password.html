<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret Message</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background-color: #000000;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      
      .container {
        text-align: center;
        width: 100%;
      }
      
      /* Logo Section */
      .logo-container {
        margin: 2rem 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .logo {
        width: 10rem;
      }
      
      /* Heading Section */
      .heading {
        font-size: 1.25rem;
        font-weight: 400;
        color: #ffffff;
        margin-bottom: 0.25rem;
      }
      
      .subheading {
        font-size: 0.875rem;
        color: #d1d5db;
      }
      
      /* Message Box */
      .message-box {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: rgba(15, 15, 15, 0.9);
        border-radius: 0.5rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        padding: 3rem 2rem;
        width: 90%;
        min-height: 400px;
        margin-left: auto;
        margin-right: auto;
        border: 1px solid #27272a;
      }
      
      @media (min-width: 640px) {
        .message-box {
          width: 70%;
        }
      }
      
      @media (min-width: 768px) {
        .message-box {
          width: 60%;
        }
      }
      
      /* Form Styling */
      .password-form {
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
      }
      
      .password-form > * + * {
        margin-top: 1rem;
      }
      
      /* Label */
      .password-label {
        display: block;
        color: #ffffff;
        text-align: left;
        font-size: 0.875rem;
        font-weight: 500;
      }
      
      /* Input Field */
      .password-input {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: #161616;
        color: #e5e7eb;
        border-radius: 0.5rem;
        border: none;
        font-size: 1rem;
      }
      
      .password-input::placeholder {
        color: #6b7280;
      }
      
      .password-input:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(156, 30, 233, 0.5);
      }
      
      /* Error Message */
      .error-message {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #FF8484;
        font-size: 0.875rem;
      }
      
      .error-icon {
        width: 1rem;
        height: 1rem;
      }
      
      /* Button */
      .submit-button {
        width: 100%;
        padding: 0.75rem;
        color: #ffffff;
        border-radius: 0.5rem;
        font-weight: 400;
        font-size: 1rem;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      
      .submit-button:hover {
        opacity: 0.9;
      }
      
      .submit-button.enabled {
        background-color: #9C1EE9;
      }
      
      .submit-button.disabled {
        background-color: #515151;
      }
      
      /* Shake Animation */
      @keyframes shake {
        0% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-5px);
        }
        40% {
          transform: translateX(5px);
        }
        60% {
          transform: translateX(-5px);
        }
        80% {
          transform: translateX(5px);
        }
        100% {
          transform: translateX(0);
        }
      }
      
      .shake {
        animation: shake 0.4s ease-in-out;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Logo -->
      <div class="logo-container">
        <img
          src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/logo.png"
          alt="logo"
          class="logo"
        />
      </div>

      <!-- Heading -->
      <h2 class="heading">
        View your secret message & file
      </h2>
      <p class="subheading">View Remaining {{ remaining_views }}</p>

      <!-- Message Box (Password Input) -->
      <div class="message-box">
        <form method="get" class="password-form">
          <label for="password" class="password-label">
            Enter Password
          </label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your secret password"
            required
            class="password-input"
          />

          {% if error %}
          <div class="error-message shake">
            <img
              src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/swarn.png"
              alt="error"
              class="error-icon"
            />
            {{ error }}
          </div>
          {% endif %}

          <button
            type="submit"
            class="submit-button {% if error %}disabled{% else %}enabled{% endif %}"
          >
            View my Secret
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
