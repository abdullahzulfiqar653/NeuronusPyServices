<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret Message</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-black text-white flex items-center justify-center min-h-screen w-full"
  >
    <div class="text-center w-full">
      <!-- Logo -->
      <div class="my-8 flex items-center justify-center">
        <img
          src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/logo.png"
          alt="logo"
          class="w-40"
        />
      </div>

      <!-- Message Box (Limit) -->
      <div
        class="mt-8 flex flex-col items-center justify-center bg-[#0F0F0F]/80 rounded-lg shadow-lg px-8 py-12 mx-auto border border-zinc-800 w-[90%] sm:w-[70%] md:w-[60%] min-h-[400px]"
      >
        <div class="flex flex-col items-center">
          <div
            class="flex items-center justify-center rounded-full bg-gray-700 mb-6"
          >
            <img
              src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/warn.png"
              alt="warn"
              class="w-12"
            />
          </div>
          <p class="text-red-400 text-sm font-medium text-center">
            {{ message }}
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
