<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret Message</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background-color: #000000;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      
      .container {
        text-align: center;
        width: 100%;
      }
      
      /* Logo Section */
      .logo-container {
        margin: 2rem 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .logo {
        width: 10rem;
      }
      
      /* Message Box */
      .message-box {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: rgba(15, 15, 15, 0.8);
        border-radius: 0.5rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        padding: 3rem 2rem;
        margin-left: auto;
        margin-right: auto;
        border: 1px solid #27272a;
        width: 90%;
        min-height: 400px;
      }
      
      @media (min-width: 640px) {
        .message-box {
          width: 70%;
        }
      }
      
      @media (min-width: 768px) {
        .message-box {
          width: 60%;
        }
      }
      
      /* Content Container */
      .content-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      
      /* Warning Icon Container */
      .warning-container {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background-color: #374151;
        margin-bottom: 1.5rem;
        width: 4rem;
        height: 4rem;
      }
      
      .warning-icon {
        width: 3rem;
        height: 3rem;
      }
      
      /* Message Text */
      .message-text {
        color: #f87171;
        font-size: 0.875rem;
        font-weight: 500;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Logo -->
      <div class="logo-container">
        <img
          src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/logo.png"
          alt="logo"
          class="logo"
        />
      </div>

      <!-- Message Box (Limit) -->
      <div class="message-box">
        <div class="content-container">
          <div class="warning-container">
            <img
              src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/warn.png"
              alt="warn"
              class="warning-icon"
            />
          </div>
          <p class="message-text">
            {{ message }}
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
