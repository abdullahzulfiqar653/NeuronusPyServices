<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .container {
      text-align: center;
      width: 100%;
    }

    /* Logo Section */
    .logo-container {
      margin: 2rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 10rem;
    }

    /* Heading Section */
    .heading {
      font-size: 1.25rem;
      font-weight: 400;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .subheading {
      font-size: 0.875rem;
      color: #d1d5db;
    }

    /* Message Box */
    .message-box {
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #1C1C1C;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      padding: 3rem 2rem;
      width: 90%;
      min-height: 400px;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid #27272a;
    }

    @media (min-width: 640px) {
      .message-box {
        width: 70%;
      }
    }

    @media (min-width: 768px) {
      .message-box {
        width: 60%;
      }
    }

    /* Content Container */
    .content-container {
      width: 100%;
      max-width: 64rem;
      border-radius: 0.5rem;
      padding: 0.25rem;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .content-container {
        padding: 1.5rem;
      }
    }

    .content-container>*+* {
      margin-top: 1.5rem;
    }

    /* Message */
    .message-content {
      background-color: #000000;
      color: #e5e7eb;
      border-radius: 0.5rem;
      padding: 1rem;
      line-height: 1.625;
      text-align: left;
    }

    /* Files Grid */
    .files-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .files-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 768px) {
      .files-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* File Card */
    .file-card {
      background-color: #000000;
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    /* File Preview */
    .file-preview {
      position: relative;
      cursor: pointer;
    }

    .file-preview img {
      width: 100%;
      height: 10rem;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .file-preview:hover img {
      opacity: 0.7;
    }

    .preview-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .file-preview:hover .preview-overlay {
      opacity: 1;
    }

    .eye-icon {
      width: 2rem;
      height: 2rem;
      filter: invert(1);
    }

    .file-preview-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 10rem;
      background-color: #18181b;
      color: #9ca3af;
      font-size: 0.875rem;
      position: relative;
    }

    .file-preview-placeholder img {
      width: 4rem;
      height: 4rem;
      opacity: 0.8;
    }

    /* File Info */
    .file-info {
      padding: 0.75rem;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      color: #e5e7eb;
      font-size: 0.875rem;
    }

    .file-details {
      width: 90%;
      text-align: left;
      word-break: break-word;
    }

    .file-name {
      word-break: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      max-height: 70px;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: left;
    }

    /* Download Button */
    .download-btn {
      color: #9c1ee9;
      flex-shrink: 0;
    }

    .download-btn:hover {
      opacity: 0.8;
    }

    .download-icon {
      width: 1.25rem;
      height: 1.25rem;
    }

    /* Done Button */
    .done-btn-container {
      display: flex;
      justify-content: center;
    }

    .done-btn {
      color: #ffffff;
      margin-top: 1.5rem;
      width: 444px;
      padding: 0.75rem 2.5rem;
      border-radius: 0.5rem;
      background-color: #9c1ee9;
      display: inline-block;
      text-align: center;
      text-decoration: none;
    }

    .done-btn:hover {
      opacity: 0.9;
    }

    /* Modal Styles */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 1rem;
    }

    .modal:target {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      position: relative;
      background: #1C1C1C;
      border-radius: 0.5rem;
      padding: 1rem 2rem;
      width: 90vw;
      max-width: 720px;
      height: 90vh;
      max-height: 746px;
      border: 1px solid #27272a;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      width: 100%;
      gap: 1rem;
      flex-shrink: 0;
    }

    .modal-title-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      width: 60%;
      align-items: center;
    }

    .modal-download-text {
      font-weight: 400;
      font-size: 1rem;
      color: #ffffff;
      text-align: left;
      text-decoration: none;
    }

    .modal-download-text:hover {
      text-decoration: underline;
    }

    .modal-file-name {
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn {
      text-decoration: none;
      color: white;
      font-size: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .close-btn:hover {
      color: #ebebeb;
    }

    .modal-image-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }

    .modal-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0.25rem;
    }

    @media (max-width: 640px) {
      .modal-content {
        padding: 1rem;
      }
    }

    /* Hide modal by default */
    .modal {
      opacity: 0;
      visibility: hidden;
      display: flex;
    }

    .modal:target {
      opacity: 1;
      visibility: visible;
    }

    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 10rem;
      background-color: #18181b;
      color: #9ca3af;
      font-size: 0.875rem;
    }

    .spinner {
      border: 2px solid #27272a;
      border-top: 2px solid #9c1ee9;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <script>
    // Encryption/Decryption Functions - Matches provided cryptoOperations.js logic

    // Check for Secure Context (Required for Web Crypto API)
    // Check for Secure Context (Required for Web Crypto API)
    if (!window.crypto || !window.crypto.subtle) {
      // Crypto not available
    }

    /**
     * Hash a user-provided key using SHA-256
     */
    async function hashUserKey(userKey) {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error("Web Crypto API is not available in this browser context (requires HTTPS or localhost).");
      }
      const encoder = new TextEncoder();
      const data = encoder.encode(userKey);
      return await crypto.subtle.digest('SHA-256', data);
    }

    /**
     * Hash file binary data using SHA-256
     */
    async function hashFileBinary(fileBinary) {
      const arrayBuffer = fileBinary instanceof ArrayBuffer
        ? fileBinary
        : fileBinary.buffer;

      const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }

    /**
     * Import a hashed key for AES-GCM
     */
    async function importAESKey(hashedKey) {
      return await crypto.subtle.importKey(
        'raw',
        hashedKey,
        { name: 'AES-GCM' },
        false,
        ['encrypt', 'decrypt']
      );
    }

    /**
     * Get the encryption key from user input or storage
     */
    async function getEncryptionKey(userKey = null) {
      let hashedKey;

      if (userKey && userKey.trim().length > 0) {
        hashedKey = await hashUserKey(userKey);
      } else {
        const storedKeyHashBase64 = localStorage.getItem('user_encryption_key_hash');
        if (!storedKeyHashBase64) {
          throw new Error('No encryption key found. Please enter your encryption key.');
        }
        hashedKey = base64ToArrayBuffer(storedKeyHashBase64);
      }

      return await importAESKey(hashedKey);
    }

    /**
     * Setup encryption environment with user key
     */
    async function setupEncryptionEnvironment(userKey) {
      try {
        if (!userKey || typeof userKey !== 'string' || userKey.trim().length === 0) {
          return { success: false, message: 'Invalid key' };
        }

        const hashedKey = await hashUserKey(userKey);

        // Convert to base64 for storage
        const hashedKeyBytes = new Uint8Array(hashedKey);
        const chunkSize = 0x8000;
        let binary = '';
        for (let i = 0; i < hashedKeyBytes.length; i += chunkSize) {
          const chunk = hashedKeyBytes.subarray(i, Math.min(i + chunkSize, hashedKeyBytes.length));
          binary += String.fromCharCode.apply(null, chunk);
        }
        const hashedKeyBase64 = btoa(binary);

        localStorage.setItem('user_encryption_key_hash', hashedKeyBase64);

        return { success: true, message: 'Key set' };
      } catch (error) {
        throw error;
      }
    }

    // Utility Functions
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      let binary = '';
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, Math.min(i + chunkSize, bytes.length));
        binary += String.fromCharCode.apply(null, chunk);
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      if (!base64) return new Uint8Array(0).buffer;

      // Clean up the string and handle web-safe Base64
      let processedBase64 = base64.trim()
        .replace(/-/g, '+')
        .replace(/_/g, '/')
        .replace(/\s/g, '');

      // Fix missing padding
      while (processedBase64.length % 4 !== 0) {
        processedBase64 += '=';
      }

      try {
        const binaryString = atob(processedBase64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
      } catch (e) {
        throw new Error("Invalid Base64 encoding: " + e.message);
      }
    }

    /**
     * Decrypt data using AES-GCM
     */
    async function decryptWithAES(encryptedBase64, key) {
      const combined = base64ToArrayBuffer(encryptedBase64);
      const iv = combined.slice(0, 12);
      const encrypted = combined.slice(12);

      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        encrypted
      );

      const decoder = new TextDecoder();
      return decoder.decode(decrypted);
    }

    /**
     * Decrypt an encrypted file hash
     */
    async function decryptFile(encryptedHashBase64, userKey = null) {
      try {
        if (!encryptedHashBase64) {
          throw new Error("No encrypted hash provided.");
        }

        const key = await getEncryptionKey(userKey);

        // Decrypt the encrypted hash data
        const decryptedString = await decryptWithAES(encryptedHashBase64, key);

        // Parse the decrypted data (h: hash, m: mimeType, d: data)
        const hashData = JSON.parse(decryptedString);
        const fileHash = hashData.h || hashData.hash;
        const mimeType = hashData.m || hashData.mimeType || 'application/octet-stream';
        const base64Data = hashData.d || hashData.data || hashData.base64;

        if (!base64Data) throw new Error("Decrypted data is empty");

        // Convert base64 to Blob
        const fileBinary = base64ToArrayBuffer(base64Data);
        const blob = new Blob([fileBinary], { type: mimeType });

        // Verify hash if possible
        const computedHash = await hashFileBinary(fileBinary);
        if (computedHash !== fileHash) {
          // Hash verification failed
        }

        // Create data URL for display
        const dataUrl = `data:${mimeType};base64,${base64Data}`;

        return { blob, dataUrl, mimeType, hash: fileHash };

      } catch (error) {
        throw new Error(`File decryption failed: ${error.message}`);
      }
    }

    /**
     * Decrypt a message (text content)
     */
    async function decryptMessage(encryptedMessageBase64, userKey = null) {
      try {
        if (!encryptedMessageBase64) {
          return null;
        }

        const key = await getEncryptionKey(userKey);

        // Decrypt the encrypted message data
        const decryptedString = await decryptWithAES(encryptedMessageBase64, key);

        // Parse the decrypted data (h: hash, m: mimeType, d: data)
        const hashData = JSON.parse(decryptedString);
        const base64Data = hashData.d || hashData.data || hashData.base64;

        if (!base64Data) {
          throw new Error("Decrypted message data is empty");
        }

        // Convert base64 to text
        const binaryString = atob(base64Data);
        const text = binaryString;

        return text;

      } catch (error) {
        throw new Error(`Message decryption failed: ${error.message}`);
      }
    }

    /**
     * Decrypt and display file on the page
     */
    async function decryptAndDisplayFile(encryptedHash, fileIndex, fileName, userKey) {
      try {
        const fileCard = document.querySelector(`.file-card[data-file-index="${fileIndex}"]`);
        if (!fileCard) {
          return;
        }

        const imgElement = fileCard.querySelector('.file-preview img');
        const modalElement = document.querySelector(`.modal[data-file-index="${fileIndex}"]`);
        const modalImgElement = modalElement ? modalElement.querySelector('.modal-image') : null;
        const downloadLinks = fileCard.querySelectorAll('a[download]');
        const modalDownloadLink = modalElement ? modalElement.querySelector('a.modal-download-text') : null;
        const placeholder = fileCard.querySelector('.file-preview-placeholder');

        // Decrypt the file
        const decryptedData = await decryptFile(encryptedHash, userKey);

        // Check if it's an image
        const isImage = decryptedData.mimeType.startsWith('image/');

        if (isImage && imgElement) {
          imgElement.src = decryptedData.dataUrl;
          imgElement.style.display = 'block';
          if (placeholder) placeholder.style.display = 'none';

          if (modalImgElement) modalImgElement.src = decryptedData.dataUrl;
        } else {
          // Show file icon for non-images
          if (placeholder) {
            placeholder.innerHTML = '<img src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/icons8-file-256.png" alt="file" style="width: 4rem; height: 4rem;" />';
            placeholder.style.display = 'flex';
          }
          if (imgElement) imgElement.style.display = 'none';

          // Disable modal for non-images
          const modalTrigger = fileCard.querySelector('.modal-trigger');
          if (modalTrigger) {
            modalTrigger.onclick = (e) => e.preventDefault();
            modalTrigger.style.cursor = 'default';
          }
        }

        // Update download links
        const updateLinks = (links) => {
          links.forEach(link => {
            link.href = decryptedData.dataUrl;
            link.download = fileName;
          });
        };
        updateLinks(downloadLinks);
        if (modalDownloadLink) {
          modalDownloadLink.href = decryptedData.dataUrl;
          modalDownloadLink.download = fileName;
        }

      } catch (error) {
        const fileCard = document.querySelector(`.file-card[data-file-index="${fileIndex}"]`);
        if (fileCard) {
          const placeholder = fileCard.querySelector('.file-preview-placeholder');
          if (placeholder) {
            placeholder.innerHTML = `<div class="loading" style="color: #ff4444; padding: 1rem; font-size: 0.75rem;">Error: ${error.message}</div>`;
          }
        }
      }
    }

    function getKeyFromUrl() {
      try {
        // Use URLSearchParams which safely handles URL encoding
        const urlParams = new URLSearchParams(window.location.search);
        const key = urlParams.get('key');
        return key;
      } catch (error) {
        // Fallback to manual parsing if URLSearchParams fails
        const url = window.location.href;
        const keyIndex = url.indexOf('key=');
        if (keyIndex === -1) {
          return null;
        }

        let key = url.substring(keyIndex + 4);
        const nextAmpersand = key.indexOf('&');
        if (nextAmpersand !== -1) {
          key = key.substring(0, nextAmpersand);
        }

        // Try to decode, but catch errors if it's not valid URI encoding
        try {
          return decodeURIComponent(key);
        } catch (e) {
          // If decode fails, return the key as-is (it might not be URI encoded)
          return key;
        }
      }
    }

    // Initialize decryption when page loads
    document.addEventListener('DOMContentLoaded', async function () {
      if (!window.crypto || !window.crypto.subtle) {
        const errorMsg = "Decryption failed: Browser disabled Crypto API because this is an insecure context. Please use 'http://localhost:8000' or HTTPS.";
        document.querySelectorAll('.file-preview-placeholder').forEach(p => {
          p.innerHTML = `<div class="loading" style="color: #ff4444; padding: 1rem; font-size: 0.75rem;">${errorMsg}</div>`;
        });
        return;
      }

      const userKey = getKeyFromUrl();

      if (!userKey) {
        if (!localStorage.getItem('user_encryption_key_hash')) {
          return;
        }
      } else {
        await setupEncryptionEnvironment(userKey);
      }

      // Decrypt and display message if it exists
      const messageElement = document.querySelector('.message-content');
      if (messageElement) {
        const encryptedMessage = messageElement.getAttribute('data-encrypted-message');
        if (encryptedMessage) {
          try {
            const decryptedMessage = await decryptMessage(encryptedMessage, userKey);
            const messageParagraph = messageElement.querySelector('p');
            if (messageParagraph) {
              // Convert newlines to <br> tags
              const formattedMessage = decryptedMessage.replace(/\n/g, '<br>');
              messageParagraph.innerHTML = formattedMessage;
            }
          } catch (error) {
            console.error('Failed to decrypt message:', error);
            const messageParagraph = messageElement.querySelector('p');
            if (messageParagraph) {
              messageParagraph.textContent = 'Failed to decrypt message.';
            }
          }
        }
      }

      // Get all file cards
      const fileCards = document.querySelectorAll('.file-card');

      fileCards.forEach((card) => {
        const encryptedHash = card.getAttribute('data-file-url');
        const fileIndex = card.getAttribute('data-file-index');
        const fileName = card.querySelector('.file-name')?.textContent || 'file';

        if (encryptedHash && fileIndex !== null) {
          decryptAndDisplayFile(encryptedHash, parseInt(fileIndex), fileName, userKey);
        }
      });
    });
  </script>
</head>

<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo-container">
      <img src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/logo.png" alt="logo"
        class="logo" />
    </div>

    <!-- Heading -->
    <h2 class="heading">
      View your secret message & file
    </h2>
    <p class="subheading">View Remaining {{ remaining_views }}</p>

    <!-- Message Box (Secret Content) -->
    <div class="message-box">
      <div class="content-container">
        {% if message %}
        <!-- Message -->
        <div class="message-content" data-encrypted-message="{{ message }}">
          <p class="text-left">Decrypting message...</p>
        </div>
        {% endif %}

        <!-- Files Grid -->
        <div class="files-grid">
          {% for file in files %}
          {% with fname=file.name|lower %}
          <div class="file-card" data-file-url="{{ file.url }}" data-file-index="{{ forloop.counter0 }}">

            <!-- Dynamic Preview (Decrypted by JS) -->
            <div class="file-preview">
              <a href="#modal-{{ forloop.counter }}" class="modal-trigger">
                <!-- Placeholder shown initially or for non-images -->
                <div class="file-preview-placeholder">
                  <div class="loading">
                    <div class="spinner"></div>
                  </div>
                </div>
                <!-- Image shown only if decrypted MIME is image -->
                <img src="" alt="{{ file.name }}" style="display: none;" crossorigin="anonymous"
                  onerror="this.onerror=null; this.src='https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/icons8-file-256.png';" />
                <div class="preview-overlay"></div>
              </a>
            </div>

            <!-- File Info -->
            <div class="file-info">
              <div class="file-details">
                <p class="file-name">{{ file.name }}</p>
                <p class="file-size">{{ file.size }}</p>
              </div>
              <a href="#" target="_blank" download class="download-btn">
                <img src="https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/download.png"
                  alt="download" class="download-icon" />
              </a>
            </div>

            <!-- Modal for each image (Hidden by default, shown by JS if needed) -->
            <div id="modal-{{ forloop.counter }}" class="modal" data-file-index="{{ forloop.counter0 }}">
              <div class="modal-content">
                <div class="modal-header">
                  <div class="modal-title-grid">
                    <a href="#" target="_blank" download class="modal-download-text"><span>Download</span></a>
                    <span class="modal-file-name">{{ file.name }}</span>
                  </div>
                  <a href="#" class="close-btn">&times;</a>
                </div>
                <div class="modal-image-container">
                  <img src="" alt="{{ file.name }}" class="modal-image"
                    onerror="this.onerror=null; this.src='https://neuroservices.lon1.cdn.digitaloceanspaces.com/static/ghosttransfer/icons8-file-256.png';" />
                </div>
              </div>
            </div>
